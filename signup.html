<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Buyer Account | VALERIS Garment Export House</title>
  <meta name="description" content="Register your fashion brand or retail group with the VALERIS B2B Garment Export House portal." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <main class="auth-page">
    <div class="auth-form-pane" style="padding-top:72px;">
      <div class="auth-top-controls">
        <button type="button" class="icon-toggle-btn" data-theme-toggle aria-label="Toggle Light or Dark theme"><span aria-hidden="true">&#9681;</span></button>
        <button type="button" class="icon-toggle-btn" data-dir-toggle aria-label="Toggle RTL or LTR direction"><span aria-hidden="true">&#8644;</span></button>
      </div>

      <div class="auth-card" style="max-width:460px;">
        <div style="text-align:center; margin-bottom:18px;">
          <a href="index.html" class="brand-logo" style="justify-content:center; margin-bottom:10px;">
            <svg class="brand-logo-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
              <rect width="64" height="64" rx="14" fill="#244C3C"/>
              <rect x="6" y="6" width="52" height="52" rx="10" stroke="#B69A65" stroke-width="1.5" stroke-opacity="0.55"/>
              <path d="M18 19L32 47L46 19" stroke="#F7F5EF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M24 19L32 35L40 19" stroke="#B69A65" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="15" y1="32" x2="49" y2="32" stroke="#B69A65" stroke-width="1.4" stroke-dasharray="2 3"/>
            </svg>
            <span class="brand-logo-text" style="text-align:start;">
              <span class="brand-name">VALERIS</span>
              <span class="brand-sub">Export House</span>
            </span>
          </a>
          <h1 class="display-font" style="font-size:1.85rem; margin-bottom:2px;">Create Buyer Account</h1>
        </div>

        <form id="signup-form" novalidate>
          <div style="display:flex; flex-direction:column; gap:14px;">
            <div class="form-group">
              <label class="form-label" for="signup-name">Full Name</label>
              <input class="form-control" id="signup-name" type="text" placeholder="Full Name" required />
              <span class="field-error"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-company">Company Name</label>
              <input class="form-control" id="signup-company" type="text" placeholder="Company / Brand" required />
              <span class="field-error"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-email">Business Email</label>
              <input class="form-control" id="signup-email" type="email" placeholder="buyer@brand.com" required />
              <span class="field-error"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-phone">Phone Number</label>
              <input class="form-control" id="signup-phone" type="tel" placeholder="+44 7700 900123" required />
              <span class="field-error"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-password">Password</label>
              <div class="password-wrap">
                <input class="form-control" id="signup-password" type="password" placeholder="Min 8 chars" required />
                <button type="button" class="password-toggle-btn" data-toggle-password="signup-password" aria-label="Show password">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <span class="field-error"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="signup-confirm">Confirm Password</label>
              <div class="password-wrap">
                <input class="form-control" id="signup-confirm" type="password" placeholder="Repeat password" required />
                <button type="button" class="password-toggle-btn" data-toggle-password="signup-confirm" aria-label="Show confirm password">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <span class="field-error"></span>
            </div>

            <div class="form-group full" style="margin-top:4px;">
              <label style="display:inline-flex; align-items:center; gap:8px; font-size:0.84rem; cursor:pointer;">
                <input type="checkbox" id="signup-terms" />
                <span>I agree to the VALERIS B2B Terms &amp; Conditions and Privacy Policy.</span>
              </label>
              <span class="field-error"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Create Account</button>
          <div id="signup-status" class="form-status-box" role="status" aria-live="polite"></div>
        </form>

        <div style="text-align:center; margin-top:16px;">
          <span style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em;">Or register with</span>
          <div class="social-auth-row">
            <button type="button" class="social-icon-only-btn" aria-label="Sign up with Google" title="Google SSO requires OAuth configuration">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z"/></svg>
            </button>
            <button type="button" class="social-icon-only-btn" aria-label="Sign up with Facebook" title="Facebook SSO requires OAuth configuration">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
            </button>
            <button type="button" class="social-icon-only-btn" aria-label="Sign up with Apple" title="Apple SSO requires OAuth configuration">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
            </button>
          </div>
        </div>

        <p style="text-align:center; font-size:0.86rem; margin-top:16px; color:var(--text-secondary);">
          Already have an account? <a href="login.html" style="color:var(--text-gold); font-weight:600;">Login</a>
        </p>
      </div>
    </div>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
